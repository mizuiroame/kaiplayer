name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # tests/Dockerfile.host: Debian 12's gcc and the host FFmpeg 7.1 built from its checked release with ffmpeg/configure.sh (the slow part, cached by its version).
      # The image's layers are kept in the Actions cache, so it is only
      # rebuilt when the Dockerfile changes.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: ffmpeg
          file: tests/Dockerfile.host
          tags: kaiplayer-host
          load: true
          cache-from: type=gha,scope=kaiplayer-host
          cache-to: type=gha,mode=max,scope=kaiplayer-host

      # ASan/UBSan with ASLR off (setarch -R in tests/Makefile), which needs
      # seccomp=unconfined in Docker.
      - name: Run the tests
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/w" -w /w/tests kaiplayer-host make coverage

      - name: Fuzz the file parsers
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/w" -w /w/tests kaiplayer-host make fuzz ITER=1000
